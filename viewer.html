<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>One motion, five robots</title>
<style>
  :root { --ink:#191D22; --muted:#626A75; --line:#DCDFDA; --bg:#f7f7f8; --panel:#ffffff; --human:#E69F00;
          --rt-g1:#2E8B57; --rt-t1:#C97A16; --rt-h1_2:#7A5FC0; --rt-r1:#C05577; --rt-k1:#3B6FD6;
          --font-ui:"Helvetica Neue","HelveticaNeue-Light","Helvetica Neue Light",Helvetica,Arial,sans-serif; --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  * { box-sizing:border-box; } html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:var(--font-ui); font-weight:300; }
  .app { height:100dvh; display:flex; flex-direction:column; overflow:hidden; }
  .bar { display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  .titleblock { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; } h1 { margin:0; font-size:15px; font-weight:300; } .arrow { color:var(--muted); }
  select { font:inherit; font-size:13px; padding:4px 8px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
  .meta { font-family:var(--font-mono); font-size:11px; color:var(--muted); }
  .stage { position:relative; flex:1; min-height:0; background:var(--bg); }
  .stage canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  .legend { position:absolute; top:12px; right:12px; display:flex; flex-direction:column; gap:6px; align-items:flex-end; }
  .chip { display:inline-flex; align-items:center; gap:8px; font:inherit; font-size:12px; padding:4px 10px; border:1px solid var(--line); border-radius:999px; background:#fffd; color:var(--ink); cursor:pointer; }
  .chip[aria-pressed="false"] { opacity:.45; } .chip[aria-disabled="true"] { cursor:default; opacity:.35; }
  .chip .dot { width:9px; height:9px; border-radius:50%; background:#bbb; } .chip small { font-family:var(--font-mono); font-size:10px; color:var(--muted); }
  .cards { position:absolute; inset:12px 12px 44px; display:grid; gap:10px; pointer-events:none; }
  .cards[hidden] { display:none; }
  .cards .cell { position:relative; border:1px solid var(--line); border-radius:12px; }
  .cards .cell .tag { position:absolute; left:10px; top:8px; font-size:clamp(10px, 1.1vw, 12px); padding:2px 9px; border-radius:999px; background:#fffc; border:1px solid var(--line); color:var(--muted); }
  .cards .cell .tag.phys { color:#0b5c48; border-color:#9fd8c6; background:#edf8f4; }
  .cards .cell .ct { position:absolute; left:0; right:0; bottom:7px; text-align:center; font-size:clamp(11px, 1.4vw, 15px); color:var(--ink); }
  .stage.cardsmode .legend { top:auto; bottom:8px; right:12px; flex-direction:row; flex-wrap:wrap; justify-content:flex-end; max-width:72%; gap:5px; }
  .stage.cardsmode .hint { bottom:12px; max-width:26%; line-height:1.35; }
  .stage.cardsmode .legend { display:none; }                /* cards: every subject is always shown, no toggles */
  @media (max-width:900px) { .cards.wide { grid-template-columns:repeat(3, 1fr) !important; grid-template-rows:none !important; grid-auto-rows:1fr; } }
  @media (max-width:640px) { .cards { grid-template-columns:repeat(2, 1fr) !important; grid-template-rows:none !important; grid-auto-rows:1fr; } }
  .hint { position:absolute; left:12px; bottom:10px; font-family:var(--font-mono); font-size:10.5px; color:var(--muted); pointer-events:none; }
  .loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:12px; color:var(--muted); pointer-events:none; }
  .plotwrap { flex:none; height:200px; position:relative; background:var(--bg); border-top:1px solid var(--line); }
  .plotwrap canvas { width:100%; height:100%; display:block; cursor:ew-resize; touch-action:none; }
  footer.controls { display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:10px 16px; background:var(--panel); border-top:1px solid var(--line); }
  .credit { margin-left:auto; font-size:12px; color:var(--ink); opacity:.7; white-space:nowrap; }
  .credit a { color:inherit; text-decoration:underline; }
  .btn { width:34px; height:34px; display:inline-flex; align-items:center; justify-content:center; padding:0; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); cursor:pointer; }
  .readout { font-family:var(--font-mono); font-size:12px; min-width:170px; } .readout .dim { color:var(--muted); }
  input[type="range"] { flex:1; min-width:140px; accent-color:var(--human); height:22px; margin:0; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; flex:none; }
  .seg button { font:inherit; font-size:12px; padding:6px 10px; border:0; background:#fff; color:var(--ink); cursor:pointer; } .seg button[aria-pressed="true"] { background:var(--ink); color:#fff; }
  .layoutseg:not([hidden]) { display:inline-flex !important; }
  label.ctl { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); flex:none; }
</style>
<style>.titleblock h1 { display:none; } .seg { display:none; } .chip small { display:none; }</style>
<script type="importmap">{ "imports": { "three": "./static/three/three.module.js", "three/addons/": "./static/three/addons/" } }</script>

<body>
<div class="app">
  <header class="bar">
    <div class="titleblock">
      <h1 class="title">Human motion <span class="arrow">→</span> Booster K1 · Unitree G1 · Unitree H1-2 · Unitree R1 · Booster T1, DTMR output, each robot on its own clock</h1>
      <select class="motion" id="motionSel" aria-label="Motion clip"></select>
    </div>
    <div class="meta" id="meta">decoding…</div>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="3D viewer: SOMA reference body and robots performing the same motion"></canvas>
    <div class="cards" id="cards" hidden></div>
    <div class="legend" id="legend"></div>
    <div class="hint">drag orbit · scroll zoom · right-drag pan · space play/pause · ←→ step · ↑↓ clip</div>
    <div class="loading" id="loading">decoding motion data…</div>
  </div>
  <div class="plotwrap" id="plotwrap" hidden><canvas id="plot" aria-label="Root height against time; drag to scrub"></canvas></div>
  <footer class="controls">
    <button class="btn" id="play" aria-label="Play or pause">
      <svg id="icoPlay" width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><path d="M3 1.5 12 7 3 12.5z"/></svg>
      <svg id="icoPause" width="14" height="14" viewBox="0 0 14 14" fill="currentColor" style="display:none"><path d="M2.5 1.5h3v11h-3zM8.5 1.5h3v11h-3z"/></svg>
    </button>
    <span class="readout" id="clock"></span>
    <input type="range" id="scrub" min="0" max="1000" value="0" step="1" aria-label="Timeline">
    <label class="ctl">speed <select id="speed" aria-label="Playback speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label>
    <div class="seg" role="group" aria-label="View mode"><button id="modeSide" aria-pressed="true">Side by side</button><button id="modeOverlay" aria-pressed="false">Overlay</button></div>
    <div class="seg layoutseg" id="layoutSeg" role="group" aria-label="Layout" hidden><button id="layoutRow" aria-pressed="false">One scene</button><button id="layoutCards" aria-pressed="true">Cards</button></div>
    <span class="credit">Motion Data by <a href="https://bones.studio/" target="_blank" rel="noopener">Bones Studio</a></span>
  </footer>
</div>
